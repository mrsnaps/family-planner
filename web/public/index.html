<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e6b57">
  <title>Family Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Apply the saved theme before first paint so there's no flash.
    try { const t = localStorage.getItem('fp-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/icon.svg" alt="" width="34" height="34">
        <div>
          <div class="brand-name">Family Planner</div>
          <div class="brand-sub" id="brand-sub">Meals and clothes</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <button class="theme-btn" id="theme-btn" type="button"></button>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <header class="page-head">
        <div>
          <h1 id="page-title"></h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div id="page-actions" class="page-actions"></div>
      </header>
      <div id="page"></div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <script src="/app.js"></script>
</body>
</html>
