AWSTemplateFormatVersion: '2010-09-09'
Description: Family Planner accounts and online saving. Cognito sign-in (one login per person), one JSON file per household in S3, behind a small HTTP API.

Parameters:
  AppOrigin:
    Type: String
    Default: https://main.d3ofenwxb2m5fu.amplifyapp.com
    Description: Address of the hosted app, allowed to call the API.
  FeedbackEmail:
    Type: String
    Default: ''
    Description: Where "Send feedback" messages from the app are emailed (AWS asks this address to confirm first). Leave empty to turn feedback off.
  VapidPublicKey:
    Type: String
    Default: ''
    Description: Web Push public key (base64url, P-256) for reminders on the home screen app. Leave both keys empty to turn them off.
  VapidPrivateKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Web Push private key (base64url) that goes with VapidPublicKey. Keep it secret.
Conditions:
  HasFeedbackEmail: !Not [!Equals [!Ref FeedbackEmail, '']]
  HasPushKeys: !And [!Not [!Equals [!Ref VapidPublicKey, '']], !Not [!Equals [!Ref VapidPrivateKey, '']]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: family-planner
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # A changed email only takes effect once the new address is confirmed.
      UserAttributeUpdateSettings: { AttributesRequireVerificationBeforeUpdate: [email] }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy: { MinimumLength: 8, RequireLowercase: false, RequireUppercase: false, RequireNumbers: true, RequireSymbols: false }
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Family Planner code
        EmailMessage: 'Your Family Planner code is {####}'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: family-planner-app
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      LifecycleConfiguration:
        # Keeps the last 30 saves of each household to fall back on; older copies go after a day,
        # so lots of saves can't pile up storage costs.
        Rules: [{ Id: old-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 1, NewerNoncurrentVersions: 30 } }]

  # "Send feedback" in the app publishes here, and it's emailed to FeedbackEmail.
  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Family Planner
      Subscription: !If [HasFeedbackEmail, [{ Protocol: email, Endpoint: !Ref FeedbackEmail }], !Ref AWS::NoValue]

  DataFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: household-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource:
                  - !Sub '${DataBucket.Arn}/households/*'
                  - !Sub '${DataBucket.Arn}/members/*'
                  - !Sub '${DataBucket.Arn}/invites/*'
                  - !Sub '${DataBucket.Arn}/shortcuts/*'
              # Lets a missing file read as "not found" instead of "access denied".
              # Listing old versions and invite codes lets "Delete my account" remove everything.
              - { Effect: Allow, Action: [s3:ListBucket, s3:ListBucketVersions], Resource: !GetAtt DataBucket.Arn }
              - { Effect: Allow, Action: cognito-idp:AdminDeleteUser, Resource: !GetAtt UserPool.Arn }
              - { Effect: Allow, Action: sns:Publish, Resource: !Ref FeedbackTopic }

  DataFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      # Long enough for the 15-minute reminder run to reach every phone.
      Timeout: 60
      Role: !GetAtt DataFunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
          USER_POOL_ID: !Ref UserPool
          FEEDBACK_TOPIC: !If [HasFeedbackEmail, !Ref FeedbackTopic, '']
          # API Gateway's own CORS settings reject the iPhone app's capacitor:// origin, so CORS is answered here.
          ORIGINS: !Sub '${AppOrigin} capacitor://localhost http://localhost:5173 http://localhost:5175'
          VAPID_PUBLIC: !Ref VapidPublicKey
          VAPID_PRIVATE: !Ref VapidPrivateKey
          VAPID_SUBJECT: !Ref AppOrigin
      Code:
        ZipFile: |
          // Household data API behind Cognito sign-in. Deployed inline by infra/cloud.yaml: run
          // `node infra/build.mjs` after editing to copy this file into the template.
          //   GET  /data       the household's saved data       PUT /data { data, baseRev }
          //   GET  /rev        just the saved version, for a cheap "anything new?" check
          //   GET  /household  who's in the household           POST /invite -> { code }
          //   POST /join { code }  join another household       POST /leave
          //   POST /delete-account  removes the login and everything only this person can see
          //   POST /feedback { text, page }  emails the app's owner (FEEDBACK_TOPIC), up to 10 a day each
          //   GET  /push/key, POST /push/subscribe|unsubscribe|schedule|test  reminders on a home screen
          //        app (Web Push), sent by the same function every 15 minutes (EventBridge)
          //   POST /shortcut/key, /shortcut/key/revoke  a key for the "Hey Siri" Shortcut, which calls
          //   POST /shortcut/add { key, item } or { key, text }  without signing in (its own route in cloud.yaml)
          //   POST /fetch-page { url }  opens a recipe page for "Recipe from a link" (a browser can't, because
          //        of CORS); public addresses only, 2 MB and 10 seconds at most, 40 a day each
          // Each person signs in with their own email. Someone who hasn't joined a household has
          // their own, under their user id, so accounts made before households existed keep working.
          const { S3Client, GetObjectCommand, HeadObjectCommand, PutObjectCommand, DeleteObjectCommand, ListObjectVersionsCommand, ListObjectsV2Command } = require('@aws-sdk/client-s3');
          const { CognitoIdentityProviderClient, AdminDeleteUserCommand } = require('@aws-sdk/client-cognito-identity-provider');
          const { SNSClient, PublishCommand } = require('@aws-sdk/client-sns');
          const crypto = require('crypto');
          const dns = require('dns');
          // Shared with the self-hosted server; infra/build.mjs copies it in here for the template.
          const { makeFetchPage } = (() => {
            const module = { exports: {} };
            // Fetching a recipe page for "Recipe from a link".
            //
            // The food module never fetches by itself: it's handed a fetcher, `async (url) => html string`.
            //  - On the Node server, server.js hands it nodeFetchPage(): the global fetch, with a 10 second
            //    timeout and a 2 MB cap, http and https only, and never to a private or loopback address
            //    (checked again after every redirect), so a link can't be used to reach the home network.
            //  - In the browser build (the hosted app), a page on another site can't be fetched directly
            //    (CORS), so the route uses globalThis.FamilyPlannerFetchPage when something sets it (a cloud
            //    proxy, with the same contract: async (url) => html string, throwing an Error with a
            //    `status` and a friendly `message` when it can't). Without one, the route answers 409 and the
            //    page offers a box to paste the recipe instead.
            const MAX_BYTES = 2 * 1024 * 1024;
            const TIMEOUT_MS = 10000;

            const fail = (status, message) => Object.assign(new Error(message), { status });

            function v4Private(ip) {
              const p = ip.split('.').map(Number);
              if (p.length !== 4 || p.some((n) => !Number.isInteger(n) || n < 0 || n > 255)) return true; // not a normal address: refuse
              const [a, b] = p;
              return a === 0 || a === 10 || a === 127 || a >= 224 ||
                (a === 100 && b >= 64 && b <= 127) || // carrier-grade NAT
                (a === 169 && b === 254) || // link-local (and cloud metadata)
                (a === 172 && b >= 16 && b <= 31) ||
                (a === 192 && b === 168) ||
                (a === 192 && b === 0 && p[2] === 0) ||
                (a === 198 && (b === 18 || b === 19));
            }

            // True for any address that isn't on the public internet.
            function isPrivateAddress(addr) {
              let ip = String(addr || '').toLowerCase().replace(/^\[|\]$/g, '').replace(/%.*$/, '');
              if (/^\d+\.\d+\.\d+\.\d+$/.test(ip)) return v4Private(ip);
              if (!ip.includes(':')) return true;
              // IPv4 inside IPv6: ::ffff:1.2.3.4, ::ffff:7f00:1, 64:ff9b::1.2.3.4
              const dotted = /(\d+\.\d+\.\d+\.\d+)$/.exec(ip);
              if (dotted) return v4Private(dotted[1]);
              const mapped = /^(?:0*:)*:?ffff:([0-9a-f]{1,4}):([0-9a-f]{1,4})$/.exec(ip);
              if (mapped) {
                const hi = parseInt(mapped[1], 16);
                const lo = parseInt(mapped[2], 16);
                return v4Private(`${hi >> 8}.${hi & 255}.${lo >> 8}.${lo & 255}`);
              }
              if (ip === '::' || ip === '::1' || /^0*(:0*)*:0*1?$/.test(ip)) return true;
              const first = parseInt(ip.split(':')[0] || '0', 16);
              return (first & 0xfe00) === 0xfc00 || // unique local fc00::/7
                (first & 0xffc0) === 0xfe80 || // link-local
                (first & 0xff00) === 0xff00 || // multicast
                first === 0x2002 || first === 0x64; // 6to4 and NAT64 can hide a private IPv4
            }

            async function checkUrl(raw, lookup) {
              let u;
              try {
                u = new URL(String(raw));
              } catch {
                throw fail(400, "That doesn't look like a web address");
              }
              if (u.protocol !== 'http:' && u.protocol !== 'https:') throw fail(400, 'Only http and https links can be opened');
              if (u.username || u.password) throw fail(400, "Links with a password in them can't be opened");
              const host = u.hostname.replace(/^\[|\]$/g, '');
              if (!host || host === 'localhost' || /\.(localhost|local|internal|home|lan)$/i.test(host)) throw fail(400, "That address is on a private network, so it can't be opened");
              let addresses;
              try {
                addresses = await lookup(host);
              } catch {
                throw fail(502, "Couldn't find that website");
              }
              const list = [].concat(addresses || []).map((a) => (typeof a === 'string' ? a : a && a.address));
              if (!list.length || list.some(isPrivateAddress)) throw fail(400, "That address is on a private network, so it can't be opened");
              return u;
            }

            async function readCapped(res, maxBytes) {
              const type = res.headers.get('content-type') || '';
              const charset = (/charset=([\w-]+)/i.exec(type) || [])[1] || 'utf-8';
              let decoder;
              try {
                decoder = new TextDecoder(charset);
              } catch {
                decoder = new TextDecoder('utf-8');
              }
              if (!res.body || typeof res.body.getReader !== 'function') {
                const text = await res.text();
                if (text.length > maxBytes) throw fail(413, 'That page is too big to read');
                return text;
              }
              const reader = res.body.getReader();
              const chunks = [];
              let size = 0;
              for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                size += value.byteLength;
                if (size > maxBytes) {
                  reader.cancel().catch(() => {});
                  throw fail(413, 'That page is too big to read');
                }
                chunks.push(value);
              }
              const all = new Uint8Array(size);
              let at = 0;
              for (const c of chunks) {
                all.set(c, at);
                at += c.byteLength;
              }
              return decoder.decode(all);
            }

            // lookup: async (hostname) => [addresses]; fetch: the WHATWG fetch to use.
            function makeFetchPage({ lookup, fetch = globalThis.fetch, timeoutMs = TIMEOUT_MS, maxBytes = MAX_BYTES, maxRedirects = 5 }) {
              return async function fetchPage(url) {
                const signal = AbortSignal.timeout(timeoutMs);
                let current = url;
                try {
                  for (let hop = 0; hop <= maxRedirects; hop++) {
                    const u = await checkUrl(current, lookup);
                    const res = await fetch(u.href, {
                      redirect: 'manual',
                      signal,
                      headers: { 'User-Agent': 'FamilyPlanner/0.2 (recipe import; home use)', Accept: 'text/html,application/xhtml+xml,application/ld+json;q=0.9,text/plain;q=0.8' },
                    });
                    const next = res.status >= 300 && res.status < 400 && res.headers.get('location');
                    if (next) {
                      current = new URL(next, u).href;
                      continue;
                    }
                    if (!res.ok) throw fail(502, `That page didn't open (it said ${res.status})`);
                    const type = res.headers.get('content-type') || '';
                    if (type && !/html|json|text\/plain|xml/i.test(type)) throw fail(415, "That link isn't a web page");
                    if (Number(res.headers.get('content-length')) > maxBytes) throw fail(413, 'That page is too big to read');
                    return await readCapped(res, maxBytes);
                  }
                } catch (e) {
                  if (e && e.status) throw e;
                  if (signal.aborted || (e && /abort|timeout/i.test(e.name || ''))) throw fail(504, 'That page took too long to open');
                  throw fail(502, "Couldn't open that page");
                }
                throw fail(502, 'That link redirects too many times');
              };
            }

            // The Node server's fetcher, or null where Node isn't available (the browser build).
            function nodeFetchPage(opts = {}) {
              const proc = typeof process !== 'undefined' ? process : null;
              if (!proc || typeof proc.getBuiltinModule !== 'function' || typeof globalThis.fetch !== 'function') return null;
              const dns = proc.getBuiltinModule('node:dns');
              if (!dns || !dns.promises) return null;
              return makeFetchPage({ lookup: (host) => dns.promises.lookup(host, { all: true, verbatim: true }), ...opts });
            }

            module.exports = { makeFetchPage, nodeFetchPage, isPrivateAddress, MAX_BYTES, TIMEOUT_MS };
            return module.exports;
          })();
          const { parse: parseChat, clauses: chatClauses } = (() => {
            const module = { exports: {} };
            // The chat's rules version: turns everyday sentences into the app's actions with plain
            // patterns, no AI. "we need milk and eggs", "Leo did the bins", "spent £20 at Tesco",
            // "Mia has a party Saturday at 2", "what's on today". Used when no AI is set up, offline, and
            // by the "Hey Siri, tell Family Planner" Shortcut on the server (infra/lambda/index.js inlines
            // this file, so it must not require anything).
            //
            // parse(text, ctx) -> { actions: [{ name, args }], unknown: ['bits it could not follow'] }
            // ctx: { today: 'YYYY-MM-DD', people: [{ id, name, adult }], children: [{ id, name }],
            //        shopping: [{ id, name, done }], pantry: [{ id, name, quantity }], chores: [{ id, name, who }],
            //        events: [{ id, title }] }  (any can be missing)

            const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            const DAY_RE = '(?:mon|tues?|wed(?:nes)?|thu(?:rs?)?|fri|sat(?:ur)?|sun)(?:day)?';
            const HOUSEHOLD = /\b(bin bags?|bin liners?|toilet (?:roll|paper)s?|kitchen roll|loo roll|washing[- ]up liquid|washing (?:powder|liquid|pods?)|fabric conditioner|dishwasher (?:tablets?|salt)|bleach|sponges?|foil|cling ?film|batter(?:y|ies)|light ?bulbs?|soap|hand wash|shampoo|conditioner|toothpaste|toothbrush(?:es)?|nappies|wipes|tissues|plasters|calpol|presents?|cards?|wrapping paper|candles|sellotape)\b/i;
            const UNIT_WORDS = { kg: 'kg', kilo: 'kg', kilos: 'kg', g: 'g', gram: 'g', grams: 'g', ml: 'ml', l: 'l', litre: 'l', litres: 'l', liter: 'l', pack: 'pack', packs: 'pack', tin: 'tin', tins: 'tin', can: 'tin', cans: 'tin', bottle: 'pcs', bottles: 'pcs', loaf: 'pcs', loaves: 'pcs', box: 'pack', boxes: 'pack', bag: 'pack', bags: 'pack', pint: 'pcs', pints: 'pcs' };
            const NUMBER_WORDS = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, twelve: 12, dozen: 12, half: 0.5 };
            const SPEND = { food: /\b(food|groceries|grocery|shopping|supermarket|tesco|sainsbury'?s?|asda|aldi|lidl|morrisons|waitrose|co-?op|iceland|m&s|ocado)\b/i, clothes: /\b(clothes|shoes|uniform|clothing|next|primark|george|matalan|clarks|h&m|zara|tu)\b/i, household: /\b(household|cleaning|boots|superdrug|b&m|wilko|ikea|argos|home ?bargains|the range|bills?)\b/i, activities: /\b(activit(?:y|ies)|club|clubs|swimming|lessons?|football|dance|cinema|trip|tickets?|party|parties)\b/i };

            const clean = (s) => String(s || '').replace(/\s+/g, ' ').trim();
            const norm = (s) => clean(String(s || '').toLowerCase().replace(/[^a-z0-9£&' -]/g, ' ')).replace(/^(the|some|a|an|my|our)\s+/, '').replace(/(es|s)$/, '');
            const capFirst = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
            const listOf = (s) => String(s || '').split(/\s*(?:,|;|&|\band\b|\bplus\b)\s*/i).map((x) => clean(x).replace(/^[.!?]+|[.!?]+$/g, '')).filter(Boolean);

            // Find the best match by name: exact, then one containing the other.
            function find(list, name, key = 'name') {
              const n = norm(name);
              if (!n || !Array.isArray(list)) return null;
              const named = list.filter((x) => x && x[key]);
              return named.find((x) => norm(x[key]) === n)
                || named.find((x) => norm(x[key]).split(' ').includes(n) || norm(x[key]).startsWith(n + ' '))
                || named.find((x) => norm(x[key]).includes(n) || n.includes(norm(x[key])))
                || null;
            }

            // Dates, worked out from today in UTC like the rest of the app.
            const addDays = (day, n) => new Date(Date.parse(day + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
            const dowOf = (day) => new Date(day + 'T00:00:00Z').getUTCDay();
            function weekdayIndex(word) {
              const w = String(word || '').toLowerCase().slice(0, 3);
              return WEEKDAYS.findIndex((d) => d.startsWith(w));
            }
            // The coming weekday (today if it is that day), or the one after with "next" when said a week ahead.
            function dateFor(word, today, next = false) {
              const w = String(word || '').toLowerCase();
              if (w === 'today' || w === 'tonight') return today;
              if (w === 'tomorrow') return addDays(today, 1);
              const i = weekdayIndex(w);
              if (i < 0) return null;
              let gap = (i - dowOf(today) + 7) % 7;
              if (next && gap === 0) gap = 7;
              return addDays(today, gap);
            }
            // "at 2", "at 2pm", "at 10.30am", "at 14:30" -> "14:00". Small hours without am/pm are afternoon.
            function timeOf(h, m, ampm) {
              let hour = Number(h);
              const min = Number(m || 0);
              if (!Number.isInteger(hour) || hour > 23 || min > 59) return null;
              const ap = String(ampm || '').toLowerCase();
              if (ap === 'pm' && hour < 12) hour += 12;
              else if (ap === 'am' && hour === 12) hour = 0;
              else if (!ap && hour >= 1 && hour <= 7) hour += 12;
              return `${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
            }
            // "Friday", "tomorrow", "12 Oct", "12/10" -> a date, for use-by dates.
            function looseDate(text, today) {
              const t = clean(text).toLowerCase();
              const d = dateFor(t.replace(/^(this|next)\s+/, ''), today, /^next\b/.test(t));
              if (d) return d;
              const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
              let m = /^(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]{3})/.exec(t);
              let day;
              let month;
              if (m) {
                day = Number(m[1]);
                month = months.indexOf(m[2]);
              } else if ((m = /^(\d{1,2})\/(\d{1,2})$/.exec(t))) {
                day = Number(m[1]);
                month = Number(m[2]) - 1;
              } else return null;
              if (month < 0 || day < 1 || day > 31) return null;
              let year = Number(today.slice(0, 4));
              let out = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              if (out < addDays(today, -30)) out = `${year + 1}${out.slice(4)}`;
              return isNaN(Date.parse(out)) ? null : out;
            }

            // "2kg chicken thighs", "3 eggs", "a loaf of bread", "milk x2" -> { name, quantity, unit }.
            function item(text) {
              let t = clean(text).replace(/^(some|more|another)\s+/i, '');
              let quantity = null;
              let unit = null;
              let m = /^(\d+(?:\.\d+)?|a|an|one|two|three|four|five|six|seven|eight|nine|ten|twelve|half a|half|a dozen|dozen)\s*(kg|kilos?|g|grams?|ml|l|litres?|liters?|packs?|tins?|cans?|bottles?|loaf|loaves|box(?:es)?|bags?|pints?)?\s+(?:of\s+)?(.+)$/i.exec(t);
              if (m) {
                const n = m[1].toLowerCase().replace(/^half a$/, 'half').replace(/^a dozen$/, 'dozen');
                quantity = NUMBER_WORDS[n] !== undefined ? NUMBER_WORDS[n] : Number(n);
                if (m[2]) unit = UNIT_WORDS[m[2].toLowerCase()] || null;
                t = m[3];
                // "a bin bags" style slips: just the name.
                if ((n === 'a' || n === 'an') && !m[2]) quantity = null;
              } else if ((m = /^(.+?)\s*(?:x|×)\s*(\d+)$/i.exec(t))) {
                t = m[1];
                quantity = Number(m[2]);
              }
              const name = clean(t).replace(/^(the|some)\s+/i, '').slice(0, 80);
              if (!name) return null;
              return { name: capFirst(name), quantity, unit, kind: HOUSEHOLD.test(name) ? 'other' : 'food' };
            }

            const personRe = (ctx) => {
              const names = [...(ctx.people || []), ...(ctx.children || [])].map((p) => p.name).filter(Boolean)
                .map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
              return names.length ? names.join('|') : null;
            };
            const personByName = (ctx, name) => find([...(ctx.people || []), ...(ctx.children || [])], name);

            // Where " and " starts a new request rather than another item: "milk and Leo did the bins".
            function clauses(text, ctx) {
              const who = personRe(ctx);
              const starts = new RegExp(`^(?:(?:we|i)\\s+(?:need|spent|bought|got|used|finished)|(?:please\\s+)?add|spent|tick|put|move|undo|what|how|no\\s|${who ? `(?:${who})\\s+(?:did|has|done|finished|have)` : '\\b\\B'})`, 'i');
              const out = [];
              for (const sentence of String(text || '').split(/(?:[.!?;]+\s+|\n+|\bthen\b)/i)) {
                let parts = [sentence];
                const bits = sentence.split(/\s+and\s+(?:also\s+)?/i);
                if (bits.length > 1) {
                  parts = [bits[0]];
                  for (const b of bits.slice(1)) {
                    if (starts.test(clean(b))) parts.push(b);
                    else parts[parts.length - 1] += ' and ' + b;
                  }
                }
                out.push(...parts.map((p) => clean(p).replace(/[.!?]+$/, '')).filter(Boolean));
              }
              return out;
            }

            function parse(text, ctx = {}) {
              const today = ctx.today || new Date().toISOString().slice(0, 10);
              const actions = [];
              const unknown = [];
              const add = (name, args = {}) => actions.push({ name, args });
